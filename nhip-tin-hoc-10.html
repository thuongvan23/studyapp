<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHỊP · Học đúng nhịp của bạn — Tin học 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1B2A; --ink-2:#22364D; --slate:#5D7389; --mute:#8A9AAC;
  --paper:#E7EBF1; --card:#FFFFFF; --line:#C9D3DF; --line-soft:#E2E8F0;
  --signal:#FFC400; --signal-dk:#E5A900; --signal-soft:#FFF3CC;
  --teal:#009C93; --teal-soft:#D9F2F0;
  --rose:#D9412F; --rose-soft:#FBE3E0;
  --grid:rgba(15,27,42,.045);
  --r-s:4px; --r-m:10px; --r-l:16px;
  --f-disp:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Be Vietnam Pro',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
  --shadow:0 1px 2px rgba(15,27,42,.05), 0 8px 24px -16px rgba(15,27,42,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-body); font-size:15.5px; line-height:1.65;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);letter-spacing:-.02em;line-height:1.2}
::selection{background:var(--signal);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--slate)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
.pad{padding:20px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.center{text-align:center}
.hide{display:none !important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:var(--r-s);font-weight:600;font-size:14.5px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.signal:hover{background:var(--signal-dk);border-color:var(--signal-dk)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.lg{padding:14px 26px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;
  background:#fff;border:1px solid var(--line);color:var(--ink-2)
}
.chip.sig{background:var(--signal-soft);border-color:var(--signal);color:#6B4E00}
.chip.teal{background:var(--teal-soft);border-color:var(--teal);color:#005E58}
.chip.rose{background:var(--rose-soft);border-color:var(--rose);color:#8C2115}
.chip.dark{background:var(--ink);border-color:var(--ink);color:#fff}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.field input,.field select{
  padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;font-size:15px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,27,42,.08)}

.divider{height:1px;background:var(--line-soft);margin:20px 0}
.hr-label{display:flex;align-items:center;gap:12px;margin:20px 0}
.hr-label::before,.hr-label::after{content:'';height:1px;background:var(--line-soft);flex:1}

/* ---------- signature: level meter ---------- */
.meter{display:flex;gap:3px;align-items:flex-end;height:26px}
.meter .seg{flex:1;min-width:3px;background:var(--line);border-radius:1px;height:60%;transition:.4s}
.meter .seg.on{background:var(--teal);height:100%}
.meter .seg.now{background:var(--signal);height:100%;animation:pulse 1.6s infinite}
.meter.tiny{height:14px;gap:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- signature: path ladder ---------- */
.ladder{position:relative;padding-left:38px}
.ladder::before{content:'';position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line)}
.rung{position:relative;margin-bottom:12px}
.rung .node{
  position:absolute;left:-38px;top:14px;width:28px;height:28px;border-radius:50%;
  border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--slate);z-index:2
}
.rung.done .node{background:var(--teal);border-color:var(--teal);color:#fff}
.rung.now .node{background:var(--signal);border-color:var(--signal);color:var(--ink);box-shadow:0 0 0 5px rgba(255,196,0,.22)}
.rung.locked .node{background:var(--paper)}
.rung-body{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;
  display:flex;align-items:center;gap:14px;transition:.15s;text-align:left;width:100%
}
.rung-body:hover{border-color:var(--ink);transform:translateX(2px)}
.rung.locked .rung-body{background:#F3F5F8;border-style:dashed;opacity:.75}
.rung.locked .rung-body:hover{transform:none;border-color:var(--line);cursor:not-allowed}
.rung.now .rung-body{border-color:var(--ink);border-width:2px;padding:13px 15px}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;min-height:100%}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{
  background:var(--ink);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh
}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.rail nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.navlink{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-s);
  color:#A9BACB;font-size:14.5px;font-weight:500;transition:.15s;text-align:left;width:100%
}
.navlink:hover{background:rgba(255,255,255,.07);color:#fff}
.navlink.active{background:var(--signal);color:var(--ink);font-weight:700}
.navlink .ic{width:18px;text-align:center;font-size:15px}
.rail .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}

.main{padding:28px 32px 80px;max-width:1180px;width:100%}
.page-head{margin-bottom:24px}
.page-head h1{font-size:clamp(26px,3.4vw,36px);font-weight:800}
.page-head p{color:var(--slate);margin-top:6px;max-width:62ch}

.logo{width:30px;height:30px;border-radius:6px;background:var(--signal);display:grid;place-items:center;flex:0 0 auto}
.logo span{display:flex;gap:2.5px;align-items:flex-end;height:15px}
.logo i{width:3.5px;background:var(--ink);border-radius:1px;display:block}

.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.side-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}

.stat{padding:16px 18px}
.stat .v{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.stat .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:4px}

.bar{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:.5s}
.bar.sig i{background:var(--signal)}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--slate);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)
}
table.tbl td{padding:12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.me{background:var(--signal-soft)}
table.tbl tbody tr.clickable:hover{background:#F5F7FA;cursor:pointer}
.rank{font-family:var(--f-mono);font-weight:600;font-size:15px;width:26px;display:inline-block}
.rank.top{color:var(--signal-dk)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:0 0 auto}
.avatar.t{background:var(--teal)}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:1.05fr .95fr;min-height:100vh}
.auth-left{background:var(--ink);color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-left::after{
  content:'';position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;
  border:1px solid rgba(255,196,0,.18)
}
.auth-left h1{font-size:clamp(34px,4.4vw,54px);font-weight:900;letter-spacing:-.035em;line-height:1.05;margin-top:34px}
.auth-left h1 em{font-style:normal;color:var(--signal)}
.auth-left p.lead{color:#A9BACB;max-width:44ch;margin-top:16px;font-size:16px}
.auth-right{display:flex;align-items:center;justify-content:center;padding:40px 32px}
.auth-card{width:100%;max-width:412px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#DCE3EB;border-radius:var(--r-s);padding:3px;gap:3px}
.tabs button{padding:10px;border-radius:3px;font-weight:600;font-size:14px;color:var(--slate);transition:.15s}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,27,42,.12)}
.demo-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-acc button{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r-s);background:#fff;text-align:left;transition:.15s
}
.demo-acc button:hover{border-color:var(--ink);background:#FAFBFC}
.demo-acc .nm{font-size:13px;font-weight:600;line-height:1.25}
.demo-acc .sub{font-family:var(--f-mono);font-size:10px;color:var(--slate)}
.marquee{display:flex;gap:4px;margin-top:auto}
.marquee i{width:9px;height:26px;border-radius:2px;background:rgba(255,255,255,.13);display:block;animation:bit 2.6s infinite ease-in-out}
.marquee i.on{background:var(--signal)}
@keyframes bit{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

/* ---------- lesson / quiz ---------- */
.reader{max-width:760px}
.reader h2{font-size:24px;font-weight:800;margin:28px 0 10px}
.reader h3{font-size:18px;font-weight:700;margin:22px 0 8px}
.reader p{margin:10px 0}
.reader ul,.reader ol{margin:10px 0 10px 22px}
.reader li{margin:5px 0}
.reader strong{font-weight:700}
.note{border-left:3px solid var(--signal);background:var(--signal-soft);padding:13px 16px;border-radius:0 var(--r-s) var(--r-s) 0;margin:16px 0}
.note.teal{border-color:var(--teal);background:var(--teal-soft)}
.note .t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
pre.code{
  background:var(--ink);color:#E8EEF5;padding:15px 17px;border-radius:var(--r-s);overflow-x:auto;
  font-family:var(--f-mono);font-size:13.5px;line-height:1.6;margin:14px 0;tab-size:4
}
pre.code .k{color:#FFC400}pre.code .s{color:#7DD3C0}pre.code .c{color:#7C93AB;font-style:italic}pre.code .n{color:#F5A3A3}
table.simple{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
table.simple th,table.simple td{border:1px solid var(--line);padding:9px 11px;text-align:left}
table.simple th{background:#F3F5F8;font-weight:700}

.q-card{border:1px solid var(--line);border-radius:var(--r-m);background:#fff;padding:18px 20px;margin-bottom:14px}
.q-num{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--slate)}
.q-text{font-weight:600;font-size:16px;margin:8px 0 14px;line-height:1.5}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);
  border-radius:var(--r-s);margin-bottom:8px;transition:.13s;text-align:left;width:100%;background:#fff
}
.opt:hover{border-color:var(--ink);background:#FAFBFC}
.opt .k{
  font-family:var(--f-mono);font-size:12px;font-weight:600;width:22px;height:22px;flex:0 0 auto;
  border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;margin-top:1px
}
.opt.sel{border-color:var(--ink);border-width:2px;padding:10px 13px;background:#F7F9FB}
.opt.sel .k{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok .k{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
.opt.bad .k{background:var(--rose);color:#fff;border-color:var(--rose)}
.opt[disabled]{pointer-events:none}

.fb{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:12px}
.fb-head{background:var(--ink);color:#fff;padding:9px 15px;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.fb-row{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:flex-start}
.fb-row:last-child{border-bottom:none}
.fb-row .lb{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--slate);flex:0 0 108px;padding-top:2px
}
.fb-row.good{background:var(--teal-soft)}
.fb-row.hint{background:var(--signal-soft)}

/* ---------- code editor ---------- */
.editor{border:1px solid var(--ink);border-radius:var(--r-m);overflow:hidden;background:var(--ink)}
.editor-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#16273A;color:#A9BACB;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}
.editor-bar .dots{display:flex;gap:5px}
.editor-bar .dots i{width:9px;height:9px;border-radius:50%;display:block;background:#33475E}
.editor-bar .dots i:first-child{background:#D9412F}
.editor-bar .dots i:nth-child(2){background:#FFC400}
.editor-bar .dots i:nth-child(3){background:#009C93}
.editor-body{display:flex;background:var(--ink);max-height:420px}
.gutter{
  padding:14px 0 14px 12px;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;
  color:#4E6580;text-align:right;user-select:none;flex:0 0 auto;overflow:hidden
}
.editor textarea{
  flex:1;background:transparent;border:none;color:#E8EEF5;font-family:var(--f-mono);font-size:13.5px;
  line-height:1.65;padding:14px 16px;resize:vertical;min-height:210px;outline:none;tab-size:4;white-space:pre;overflow:auto
}
.console{background:#0A121C;color:#B9C8D8;font-family:var(--f-mono);font-size:12.5px;padding:12px 16px;border-top:1px solid #22364D;white-space:pre-wrap;max-height:200px;overflow:auto}
.console .ok{color:#4CD5C5}.console .er{color:#FF8B7A}.console .dim{color:#66809B}

/* ---------- chat ---------- */
.chat-fab{
  position:fixed;right:22px;bottom:22px;z-index:60;width:56px;height:56px;border-radius:50%;
  background:var(--signal);color:var(--ink);display:grid;place-items:center;font-size:23px;
  box-shadow:0 6px 22px rgba(15,27,42,.28);border:2px solid var(--ink);transition:.18s
}
.chat-fab:hover{transform:scale(1.06)}
.chat-panel{
  position:fixed;right:22px;bottom:22px;z-index:61;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 44px));
  background:#fff;border:1px solid var(--ink);border-radius:var(--r-l);box-shadow:0 20px 60px rgba(15,27,42,.32);
  display:flex;flex-direction:column;overflow:hidden
}
.chat-head{background:var(--ink);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#F7F9FB}
.msg{max-width:86%;padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px;align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;border-bottom-right-radius:3px;align-self:flex-end}
.msg.sys{background:var(--signal-soft);border:1px solid var(--signal);font-size:13px;align-self:center;max-width:100%;text-align:center}
.chat-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.chat-in input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:99px;outline:none}
.chat-in input:focus{border-color:var(--ink)}
.chat-in button{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;background:#fff}
.suggest button{font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;color:var(--slate)}
.suggest button:hover{border-color:var(--ink);color:var(--ink)}
.typing{display:inline-flex;gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--slate);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- misc ---------- */
.toast{
  position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:99px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(15,27,42,.3)
}
.modal-bg{position:fixed;inset:0;background:rgba(15,27,42,.55);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:var(--r-l);max-width:520px;width:100%;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.dist{display:flex;align-items:flex-end;gap:10px;height:120px}
.dist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px;text-align:center}
.dist .col i{display:block;background:var(--ink);border-radius:3px 3px 0 0;min-height:3px;transition:.5s}
.dist .col.l1 i{background:#D9412F}.dist .col.l2 i{background:var(--signal)}
.dist .col.l3 i{background:#4A9CE0}.dist .col.l4 i{background:var(--teal)}
.dist .col span{font-family:var(--f-mono);font-size:10px;color:var(--slate)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.spin.dk{border-color:rgba(15,27,42,.2);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.mobile-nav{display:none}

@media(max-width:960px){
  .shell{grid-template-columns:1fr}

function hl(src){
  let s = esc(src);
  s = s.replace(/(#[^\n]*)/g, '<span class="c">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="s">$1</span>');
  s = s.replace(/\b(def|return|if|elif|else|for|while|in|and|or|not|True|False|None|import|break|continue|pass|range|print|input|int|float|str|len|list|map|sum|max|min|sort|append)\b/g, '<span class="k">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="n">$1</span>');
  return s;
}

/* ============================================================
   Logic học tập
   ============================================================ */
const PASS = 70;

function lessonState(u, idx){
  const L = LESSONS[idx];
  const rec = u.progress[L.id];
  if(rec && rec.done) return 'done';
  // Giáo viên mở khóa riêng cho học sinh này
  if(u.unlock && u.unlock.includes(L.id)) return 'open';
  // Bài thuộc cấp độ thấp hơn trình độ đầu vào: mở sẵn để ôn tập
  if(L.lv < u.level) return rec ? 'open' : 'review';
  // Bài đầu tiên của cấp độ được xếp: luôn mở
  const firstOfLevel = LESSONS.findIndex(x=>x.lv===u.level);
  if(idx <= firstOfLevel) return 'open';
  // Mở khi bài liền trước đã đạt
  const prev = LESSONS[idx-1];
  const prevRec = u.progress[prev.id];
  if(prevRec && prevRec.done) return 'open';
  return 'locked';
}
function isUnlocked(u, idx){ return lessonState(u, idx) !== 'locked'; }
function doneCount(u){ return LESSONS.filter(l => u.progress[l.id] && u.progress[l.id].done).length; }
function requiredLessons(u){ return LESSONS.filter(l => l.lv >= (u.level||1)); }
function finalUnlocked(u){
  const req = requiredLessons(u);
  return req.length > 0 && req.every(l => u.progress[l.id] && u.progress[l.id].done);
}
function avgScore(u){
  const v = Object.values(u.progress).map(r=>r.best);
  return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0;
}
function masteryPct(u){
  const total = LESSONS.length;
  const skipped = LESSONS.filter(l=>l.lv < (u.level||1)).length;
  const done = doneCount(u);
  return Math.round(clamp((done + skipped*0.5) / total * 100, 0, 100));
}
function levelFromScore(pct){
  if(pct < 40) return 1;
  if(pct < 60) return 2;
  if(pct < 80) return 3;
  return 4;
}
function xpFor(score, isFinal){
  const base = isFinal ? 300 : 100;
  return Math.round(base * (score/100) + (score>=PASS ? base*0.4 : 0));
}
function ranking(){
  return Object.values(S.db.users)
    .filter(u=>u.role==='student')
    .sort((a,b)=> b.xp - a.xp || avgScore(b) - avgScore(a));
}

/* AI Agent nhắc tiến độ — gợi ý việc nên làm tiếp, tính tức thời không cần gọi mô hình */
function aiSuggestion(u){
  const stuckIdx = LESSONS.findIndex((l,i)=>{
    const r = u.progress[l.id];
    return r && !r.done && r.att>=1 && isUnlocked(u,i);
  });
  if(stuckIdx>=0){
    const l = LESSONS[stuckIdx], att = u.progress[l.id].att;
    return `Bạn đang dang dở bài "${l.title}" (đã thử ${att} lần, chưa đạt 70%). Quay lại hoàn thiện trước khi sang bài mới sẽ giúp không bỏ trống nền tảng.`;
  }
  const nextIdx = LESSONS.findIndex((l,i)=> lessonState(u,i)==='open' || lessonState(u,i)==='review');
  if(nextIdx>=0){
    const l = LESSONS[nextIdx];
    return `Bài phù hợp tiếp theo với bạn là "${l.title}" (khoảng ${l.mins} phút). Đây là lựa chọn tốt để tiếp tục lộ trình.`;
  }
  if(finalUnlocked(u) && !(u.final && u.final.done))
    return 'Bạn đã hoàn thành toàn bộ bài học — hãy làm bài kiểm tra tổng kết để chốt kết quả môn học.';
  return 'Bạn đang học rất đều. Thử làm lại một bài cũ để nâng điểm cao nhất, hoặc hỏi trợ lý AI một câu hỏi mở rộng.';
}

async function askAI(messages, system, maxTokens=1000, json=false){
  const contents = messages.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  const generationConfig = { maxOutputTokens: maxTokens, thinkingConfig: { thinkingBudget: 0 } };
  if(json) generationConfig.responseMimeType = 'application/json';
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
    method:'POST',
    headers:{'Content-Type':'application/json', 'x-goog-api-key': GEMINI_KEY},
    body: JSON.stringify({
      system_instruction: { parts:[{ text: GUARD_SYS + '\n\n' + system }] },
      contents,
      generationConfig
    })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  const cand = d.candidates && d.candidates[0];
  const parts = cand && cand.content && cand.content.parts;
  return parts ? parts.map(p=>p.text||'').join('').trim() : '';
}
function parseJSON(txt){
  const clean = txt.replace(/```json|```/g,'').trim();
  const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
  return JSON.parse(a>=0 ? clean.slice(a, b+1) : clean);
}

async function gradeCode(ex, src){
  try{
    const out = await askAI([{role:'user', content:
`Chấm bài lập trình Python của học sinh lớp 10.

\`\`\`python
${src}
\`\`\`

Chỉ trả về JSON thuần, không giải thích thêm, theo đúng dạng:
{"score": <0-100>, "verdict":"<một câu kết luận>", "output":"<dự đoán kết quả in ra khi chạy, hoặc mô tả lỗi>", "errors":[{"where":"<dòng hoặc đoạn lệnh>","what":"<sai cái gì>","why":"<vì sao sai>","fix":"<sửa thế nào>"}], "comment":"<nhận xét chung 2-3 câu, khen điểm tốt trước rồi góp ý>"}
Nếu bài làm đúng hoàn toàn thì errors là mảng rỗng.`}], TUTOR_SYS, 1400, true);
    const j = parseJSON(out);
    j.score = clamp(Math.round(j.score||0), 0, 100);
    j.ai = true;
    return j;
  }catch(e){
    AI_OK = false;
    return gradeCodeLocal(ex, src);
  }
}
function gradeCodeLocal(ex, src){
  const code = (src||'').trim();
  let score = 0; const errors = [];
  if(code.length < 5){
    return {score:0, verdict:'Bài làm còn trống.', output:'Chưa có lệnh nào để chạy.',
      errors:[{where:'Toàn bộ chương trình', what:'Chưa viết lệnh nào', why:'Trình chấm không tìm thấy câu lệnh Python nào trong ô soạn thảo.', fix:'Bắt đầu từ khung gợi ý rồi hoàn thiện dần từng dòng.'}],
      comment:'Hãy thử viết dòng đầu tiên trước — chỉ cần lệnh nhập dữ liệu là bạn đã có điểm.', ai:false};
  }
  ex.rubric.forEach(r=>{
    if(r.re.test(code)) score += r.pt;
    else errors.push({where:'Trong chương trình', what:r.miss, why:'Trình chấm đối chiếu bài làm với các yêu cầu của đề và chưa thấy phần này.', fix:'Bổ sung phần còn thiếu rồi chấm lại.'});
  });
  score = clamp(score, 0, 100);
  const paren = (code.match(/\(/g)||[]).length - (code.match(/\)/g)||[]).length;
  if(paren !== 0) errors.push({where:'Dấu ngoặc tròn', what:'Số dấu mở và đóng ngoặc không khớp', why:'Thiếu hoặc thừa dấu ngoặc khiến Python báo SyntaxError.', fix:'Đếm lại từng cặp ngoặc trong các lệnh print và input.'});
  if(/\b(if|for|while|def|else|elif)\b[^\n:]*$/m.test(code) && !/:\s*$/m.test(code))
    errors.push({where:'Dòng lệnh cấu trúc', what:'Có thể thiếu dấu hai chấm cuối dòng', why:'Các lệnh if, for, while, def bắt buộc kết thúc bằng dấu hai chấm.', fix:'Thêm dấu : vào cuối dòng rồi thụt lề khối lệnh bên dưới.'});
  return {
    score,
    verdict: score>=PASS ? 'Bài làm đạt yêu cầu.' : 'Bài làm chưa đạt, cần bổ sung một số phần.',
    output: score>=PASS ? ex.expected : 'Chưa chạy được đầy đủ theo yêu cầu đề bài.',
    errors,
    comment: score>=PASS
      ? 'Bạn đã cài đặt đúng các bước chính của thuật toán. Hãy đọc lại phần đáp án mẫu để so sánh cách trình bày.'
      : 'Bạn đã bắt đầu đúng hướng. Hãy đối chiếu từng ý trong danh sách lỗi bên trên, sửa lần lượt rồi chấm lại.',
    ai:false
  };
}

async function doLogin(){
  const id = $('#lg-id').value.trim().toLowerCase();
  const pw = $('#lg-pw').value.trim();
  const err = $('#lg-err');
  const u = S.db.users[id];
  const fail = m => { err.textContent = m; err.classList.remove('hide'); };
  if(!u) return fail('Không tìm thấy tài khoản này. Hãy kiểm tra lại tên đăng nhập.');
  if(u.pw !== pw) return fail('Mật khẩu chưa đúng. Mọi tài khoản dùng thử đều dùng mật khẩu 123456.');
  if(S.authTab==='student' && u.role!=='student') return fail('Đây là tài khoản giáo viên. Hãy chuyển sang cổng Giáo viên.');
  if(S.authTab==='teacher' && u.role!=='teacher') return fail('Đây là tài khoản học sinh. Hãy chuyển sang cổng Học sinh.');
  u.last = today(); S.me = u; await saveDB();
  S.chatLog = [];
  if(u.role==='teacher') go('t-home');
  else if(!u.placement || !u.placement.done) go('placement');
  else go('home');
}

/* ============================================================
   Thành phần dùng chung: câu hỏi và phản hồi
   ============================================================ */
function qBlock(items, ans, submitted, aiFb){
  return items.map((it, i)=>{
    const sel = ans[i];
    const ok = sel === it.ans;
    return `
    <div class="q-card">
      <div class="between"><span class="q-num">Câu ${i+1} / ${items.length} <span class="chip" style="margin-left:8px">${cogLabel(i, items.length)}</span></span>
        ${submitted ? `<span class="chip ${ok?'teal':'rose'}">${ok?'✓ Đúng':'✕ Sai'}</span>` : (sel!=null?'<span class="chip">Đã chọn</span>':'')}</div>
      <div class="q-text">${it.q}</div>
      ${it.opts.map((o,j)=>{
        let cls = '';
        if(submitted){ if(j===it.ans) cls='ok'; else if(j===sel) cls='bad'; }
        else if(j===sel) cls='sel';
        return `<button class="opt ${cls}" ${submitted?'disabled':''} data-act="pick" data-i="${i}" data-j="${j}">
          <span class="k">${KEY[j]}</span><span>${o}</span></button>`;
      }).join('')}
      ${submitted && !ok ? fbBlock(it, sel, aiFb && aiFb[i]) : ''}
      ${submitted && ok ? `<div class="fb"><div class="fb-row good"><span class="lb">Vì sao đúng</span><span>${it.explain}</span></div></div>` : ''}
    </div>`;
  }).join('');
}

function fbBlock(it, sel, ai){
  const chosen = sel==null ? 'Bạn chưa chọn đáp án nào.' : `Bạn chọn <b>${KEY[sel]}. ${it.opts[sel]}</b>`;
  const why = sel==null ? 'Bỏ trống câu hỏi đồng nghĩa với việc mất trọn điểm của câu này.'
            : (it.why && it.why[sel] ? it.why[sel] : 'Phương án này không thỏa mãn yêu cầu của đề bài.');
  return `
  <div class="fb">
    <div class="fb-head">⚑ Phân tích lỗi</div>
    <div class="fb-row"><span class="lb">Sai ở đâu</span><span>${chosen}. Kiến thức liên quan: ${it.focus}</span></div>
    <div class="fb-row"><span class="lb">Vì sao sai</span><span>${why}</span></div>
    ${ai ? `<div class="fb-row"><span class="lb">Trợ lý AI</span><span>${esc(ai)}</span></div>` : ''}
    <div class="fb-row hint"><span class="lb">Gợi ý làm lại</span><span>${it.hint}</span></div>
    <div class="fb-row good"><span class="lb">Đáp án đúng</span><span><b>${KEY[it.ans]}. ${it.opts[it.ans]}</b> — ${it.explain}</span></div>
  </div>`;
}

function meter(pct, cur){
  const n = 24, on = Math.round(pct/100*n);
  return `<div class="meter">${Array.from({length:n},(_,i)=>
    `<span class="seg ${i<on?'on':''} ${cur && i===on?'now':''}"></span>`).join('')}</div>`;
}

async function submitPlacement(){
  const w = S.work;
  const correct = PLACEMENT.reduce((s,it,i)=> s + (w.ans[i]===it.ans?1:0), 0);
  const pct = Math.round(correct/PLACEMENT.length*100);
  const lv = levelFromScore(pct);
  S.me.level = lv;
  S.me.placement = {done:true, score:pct, correct, at:today(), ans:[...w.ans]};
  S.me.xp += 60;
  await saveDB();
  S.work = {kind:'placement-res', pct, correct, lv, coach:null};
  go('placement-res');
  const wrong = PLACEMENT.filter((it,i)=> w.ans[i]!==it.ans).map(it=>it.focus);
  const c = await coachSummary({what:'bài kiểm tra đầu vào môn Tin học 10', score:pct, wrong});
  if(S.work && S.work.kind==='placement-res'){ S.work.coach = c; if(S.view==='placement-res') render(); }
}

    <div class="card stat"><div class="v">#${rank}</div><div class="k">Hạng trong lớp</div></div>
  </div>

  <div class="card pad mt16">
    <div class="between wrap"><span class="eyebrow">Mức độ thành thạo chương trình</span><span class="mono" style="font-weight:600">${masteryPct(u)}%</span></div>
    <div class="mt12">${meter(masteryPct(u), true)}</div>
  </div>

  <div class="card pad mt16" style="border-color:var(--signal);border-width:2px">
    <div class="row" style="gap:10px;align-items:flex-start">
      <span style="width:26px;height:26px;border-radius:50%;background:var(--signal);color:var(--ink);display:grid;place-items:center;font-size:14px;flex:0 0 auto">✦</span>
      <div class="grow">
        <span class="eyebrow">Trợ lý AI nhắc bạn</span>
        <p class="mt8" style="font-size:14.5px">${esc(aiSuggestion(u))}</p>
        <button class="btn ghost sm mt8" data-act="go" data-v="ai">Mở trợ lý AI</button>
      </div>
    </div>
  </div>
  ${u.note ? `
  <div class="card pad mt16">
    <span class="eyebrow">Nhiệm vụ từ giáo viên</span>
    <p class="mt8" style="font-size:14.5px">${esc(u.note)}</p>
  </div>` : ''}

  <div class="side-layout mt20">
    <div>
      <h2 style="font-size:20px;margin-bottom:14px">Chặng đường của bạn</h2>
      <div class="ladder">
        ${LESSONS.map((L,i)=>{
          const st = lessonState(u,i), rec = u.progress[L.id];
          const cls = st==='done'?'done':(st==='locked'?'locked':(next && next.id===L.id?'now':''));
          const badge = st==='done' ? `<span class="chip teal">${rec.best}%</span>`
            : st==='locked' ? '<span class="chip">🔒 Chưa mở</span>'
            : st==='review' ? '<span class="chip">Ôn tập tùy chọn</span>'
            : rec ? `<span class="chip rose">Lần trước ${rec.best}%</span>` : '<span class="chip sig">Bài tiếp theo</span>';
          return `<div class="rung ${cls}">
            <div class="node">${st==='done'?'✓':i+1}</div>
            <button class="rung-body" data-act="${st==='locked'?'locked':'open-lesson'}" data-id="${L.id}">
              <div class="grow" style="min-width:0">
                <div class="eyebrow" style="font-size:9.5px">Cấp ${L.lv} · ${L.topic}${L.code?' · có bài code':''}</div>
                <div style="font-weight:700;font-size:15.5px;margin-top:2px">${esc(L.title)}</div>
                <div class="muted" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(L.goal)}</div>
              </div>
              ${badge}
            </button>
          </div>`;
        }).join('')}
        <div class="rung ${u.final&&u.final.done?'done':(fu?'now':'locked')}">
          <div class="node">◎</div>
          <button class="rung-body" data-act="${fu?'go':'locked'}" data-v="final">
            <div class="grow"><div class="eyebrow" style="font-size:9.5px">Đánh giá tổng kết</div>
              <div style="font-weight:700;font-size:15.5px;margin-top:2px">${FINAL.title}</div>
              <div class="muted" style="font-size:13px">12 câu trắc nghiệm và 1 bài thực hành lập trình</div></div>
            ${u.final&&u.final.done?`<span class="chip teal">${u.final.score}%</span>`:(fu?'<span class="chip sig">Đã mở</span>':'<span class="chip">🔒 Chưa mở</span>')}
          </button>
        </div>
      </div>
    </div>
    <div class="stack gap16">
      ${next?`<div class="card pad" style="border-color:var(--ink);border-width:2px">
        <span class="eyebrow">Việc nên làm tiếp</span>
        <h3 class="mt8" style="font-size:18px">${esc(next.title)}</h3>
        <p class="muted" style="font-size:14px;margin-top:6px">${esc(next.goal)}</p>
        <div class="row mt12" style="gap:6px;flex-wrap:wrap"><span class="chip">${next.mins} phút</span><span class="chip">${next.quiz.length} câu hỏi</span>${next.code?'<span class="chip sig">Bài lập trình</span>':''}</div>
        <button class="btn signal block mt16" data-act="open-lesson" data-id="${next.id}">Bắt đầu học</button>
      </div>`:`<div class="card pad"><span class="eyebrow">Hoàn tất</span><h3 class="mt8" style="font-size:18px">Bạn đã đi hết lộ trình</h3><p class="muted mt8" style="font-size:14px">Hãy làm bài kiểm tra tổng kết để chốt kết quả môn học.</p></div>`}
      <div class="card pad">
        <span class="eyebrow">Quy tắc mở bài</span>
        <ul class="mt12" style="margin-left:18px;font-size:14px;color:var(--ink-2)">
          <li>Đạt <b>≥ 70%</b> ở một bài thì bài kế tiếp mở ra.</li>
          <li>Chưa đạt vẫn được làm lại không giới hạn số lần.</li>
          <li>Điểm ghi nhận là <b>lần làm cao nhất</b>.</li>
          <li>Bài có phần lập trình: trắc nghiệm chiếm 60%, code chiếm 40%.</li>
        </ul>
      </div>
      <div class="card pad">
        <span class="eyebrow">Kết quả gần đây</span>
        ${Object.entries(u.progress).sort((a,b)=>(b[1].at||'').localeCompare(a[1].at||'')).slice(0,4).map(([id,r])=>{
          const L = lessonById(id); if(!L) return '';
          return `<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
            <div style="min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(L.title)}</div>
            <div class="eyebrow" style="font-size:9px">${fmtDate(r.at)} · ${r.att} lần làm</div></div>
            <span class="chip ${r.done?'teal':'rose'}">${r.best}%</span></div>`;
        }).join('') || '<p class="muted mt8" style="font-size:14px">Chưa có bài nào được ghi nhận.</p>'}
      </div>
    </div>
  </div>`;
}

/* ============================================================
   Thư viện học liệu — tìm kiếm & lọc độc lập với lộ trình
   ============================================================ */
const TYPE_LABEL = {doc:'Bài đọc', quiz:'Trắc nghiệm', code:'Bài tập'};
function diffLabel(lv){ return lv<=2 ? 'Cơ bản' : lv===3 ? 'Trung bình' : 'Nâng cao'; }
function libraryItems(){
  const items = [];
  LESSONS.forEach(L=>{
    items.push({lessonId:L.id, type:'doc', level:L.lv, title:'Bài đọc: '+L.title, sub:L.topic+' · '+L.mins+' phút', step:'theory'});
    items.push({lessonId:L.id, type:'quiz', level:L.lv, title:'Trắc nghiệm: '+L.title, sub:L.quiz.length+' câu hỏi', step:'quiz'});
    if(L.code) items.push({lessonId:L.id, type:'code', level:L.lv, title:'Bài tập: '+L.code.title, sub:'Thực hành lập trình Python', step:'code'});
  });
  return items;
}
function viewLibrary(){
  const u = S.me;
  const f = S.libFilter;
  let items = libraryItems();
  if(f.type!=='all') items = items.filter(x=>x.type===f.type);
  if(f.lv!=='all') items = items.filter(x=>x.level===+f.lv);
  if(f.q) items = items.filter(x=> (x.title+' '+x.sub).toLowerCase().includes(f.q.toLowerCase()));
  return `
  <div class="page-head"><span class="eyebrow">Thư viện học liệu</span><h1>Khám phá học liệu Tin học 10</h1>
  <p>Tìm kiếm và lọc học liệu theo loại và mức độ — độc lập với lộ trình, bạn có thể xem trước bất kỳ nội dung nào đã mở.</p></div>
  <div class="card pad">
    <div class="row wrap" style="gap:10px">
      <input id="lib-q" placeholder="Tìm theo tên bài, chủ đề…" value="${esc(f.q)}" style="flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:4px;font-size:15px">
      <button class="btn ghost sm" data-act="lib-search">Tìm</button>
    </div>
    <div class="row wrap mt12" style="gap:6px">
      <button class="chip ${f.type==='all'?'dark':''}" data-act="lib-type" data-t="all">Tất cả loại</button>
      ${Object.keys(TYPE_LABEL).map(t=>`<button class="chip ${f.type===t?'dark':''}" data-act="lib-type" data-t="${t}">${TYPE_LABEL[t]}</button>`).join('')}
    </div>
    <div class="row wrap mt8" style="gap:6px">
      <button class="chip ${f.lv==='all'?'dark':''}" data-act="lib-lv" data-l="all">Mọi cấp độ</button>
      ${LEVELS.map(lv=>`<button class="chip ${f.lv===String(lv.id)?'dark':''}" data-act="lib-lv" data-l="${lv.id}" style="border-color:${lv.color}">Cấp ${lv.id} · ${lv.name}${u.level===lv.id?' · bạn':''}</button>`).join('')}
    </div>
  </div>
  <p class="muted mt12" style="font-size:13px">${items.length} học liệu phù hợp.</p>
  <div class="grid3 mt8">
    ${items.length ? items.map(x=>{
      const idx = LESSONS.findIndex(l=>l.id===x.lessonId), L = LESSONS[idx];
      const st = lessonState(u, idx), locked = st==='locked';
      return `<button class="card pad" style="text-align:left;${locked?'opacity:.6':''}" data-act="open-resource" data-id="${x.lessonId}" data-step="${x.step}">
        <div class="between"><span class="chip ${x.type==='code'?'sig':x.type==='quiz'?'teal':''}">${TYPE_LABEL[x.type]}</span><span class="eyebrow">Cấp ${x.level}${locked?' · 🔒':''}</span></div>
        <h3 style="font-size:15.5px;margin-top:8px">${esc(x.title)}</h3>
        <p class="muted" style="font-size:13px;margin-top:6px">${esc(x.sub)}</p>
        <div class="row mt12"><span class="chip">${diffLabel(L.lv)}</span></div>
      </button>`;
    }).join('') : '<p class="muted">Không tìm thấy học liệu phù hợp — thử đổi bộ lọc.</p>'}
  </div>`;
}

/* ============================================================
   Trình soạn thảo code
   ============================================================ */
function editor(src, ex){
  const lines = (src||'').split('\n').length;
  return `
  <div class="editor">
    <div class="editor-bar">
      <div class="row" style="gap:10px"><span class="dots"><i></i><i></i><i></i></span><span>bai_tap.py · Python 3</span></div>
      <span>${ex.title}</span>
    </div>
    <div class="editor-body">
      <div class="gutter" id="gutter">${Array.from({length:Math.max(lines,12)},(_,i)=>i+1).join('<br>')}</div>
      <textarea id="code-in" spellcheck="false" placeholder="# Viết chương trình của bạn ở đây">${esc(src)}</textarea>
    </div>
  </div>`;
}

function gradeCard(g, ex){
  return `
  <div class="card mt16" style="overflow:hidden">
    <div class="between pad" style="background:${g.score>=PASS?'var(--teal-soft)':'var(--rose-soft)'};border-bottom:1px solid var(--line)">
      <div><span class="eyebrow">Kết quả chấm bài lập trình</span>
        <div style="font-weight:700;font-size:16px;margin-top:2px">${esc(g.verdict||'')}</div></div>
      <div class="center"><div class="mono" style="font-size:30px;font-weight:600">${g.score}</div><div class="eyebrow" style="font-size:9px">/100</div></div>
    </div>
    <div class="pad">
      <span class="eyebrow">Kết quả chạy thử</span>
      <div class="console mt8" style="border-radius:var(--r-s);border:none">${esc(g.output||'—')}</div>
      ${g.errors && g.errors.length ? `
        <div class="fb mt16">
          <div class="fb-head">⚑ ${g.errors.length} điểm cần sửa</div>
          ${g.errors.map((e,i)=>`
            <div class="fb-row"><span class="lb">Lỗi ${i+1}</span><span>
              <b>Sai ở đâu:</b> ${esc(e.where||'—')}<br>
              <b>Sai cái gì:</b> ${esc(e.what||'—')}<br>
              <b>Vì sao sai:</b> ${esc(e.why||'—')}<br>
              <b>Cách sửa:</b> ${esc(e.fix||'—')}</span></div>`).join('')}
        </div>` : `<div class="note teal mt16"><div class="t">Không phát hiện lỗi</div>Chương trình của bạn đáp ứng đủ các yêu cầu của đề bài.</div>`}
      <div class="note mt16"><div class="t">Nhận xét của trợ lý AI${g.ai?'':' (chế độ ngoại tuyến)'}</div>${esc(g.comment||'')}</div>
      <div class="mt16">
        <button class="btn ghost sm" data-act="toggle-sol">${S.work && S.work.showSol?'Ẩn':'Xem'} chương trình mẫu</button>
      </div>
      ${S.work && S.work.showSol ? `
        <span class="eyebrow" style="display:block;margin-top:14px">Chương trình mẫu</span>
        <pre class="code">${hl(ex.solution)}</pre>` : ''}
    </div>
  </div>`;
}

/* ============================================================
   Màn hình bài học
   ============================================================ */
function viewLesson(){
  const L = lessonById(S.params.id);
  if(!S.work || S.work.kind!=='lesson' || S.work.id!==L.id)
    S.work = {kind:'lesson', id:L.id, step:'theory', ans:Array(L.quiz.length).fill(null), code:L.code?L.code.starter:'', grade:null, coach:null, showSol:false};
  const w = S.work;
  const steps = L.code ? ['theory','quiz','code','result'] : ['theory','quiz','result'];
  const names = {theory:'Lý thuyết', quiz:'Trắc nghiệm', code:'Thực hành code', result:'Kết quả'};
  const head = `
    <div class="between wrap" style="margin-bottom:18px">
      <button class="btn ghost sm" data-act="go" data-v="home">← Lộ trình</button>
      <div class="row" style="gap:6px;flex-wrap:wrap">${steps.map((s,i)=>`
        <span class="chip ${w.step===s?'dark':''}">${i+1}. ${names[s]}</span>`).join('<span class="muted">›</span>')}</div>
    </div>`;

  if(w.step==='theory'){
    const prevRec = S.me.progress[L.id];
    const avg = avgScore(S.me);
    const isWeak = (prevRec && !prevRec.done && prevRec.att>=1) || (avg>0 && avg<60);
    const isStrong = !isWeak && avg>=85;
    const diffHtml = L.diff
      ? (isWeak ? `<div class="note mt16"><div class="t">Học liệu củng cố · dành riêng cho bạn</div>${L.diff.support.map(renderBlock).join('')}</div>`
        : isStrong ? `<div class="note teal mt16"><div class="t">Học liệu mở rộng · dành riêng cho bạn</div>${L.diff.advanced.map(renderBlock).join('')}</div>`
        : '')
      : '';
    return head + `
    <div class="page-head">
      <span class="eyebrow">Cấp ${L.lv} · ${L.topic}</span>
      <h1>${esc(L.title)}</h1>
      <p><b>Mục tiêu:</b> ${esc(L.goal)}</p>
    </div>
    <div class="side-layout">
      <div class="card pad reader">${L.theory.map(renderBlock).join('')}${diffHtml}</div>
      <div class="card pad" style="position:sticky;top:20px">
        <span class="eyebrow">Sau khi đọc xong</span>
        <p class="mt8" style="font-size:14px">Bài luyện tập gồm ${L.quiz.length} câu trắc nghiệm${L.code?' và 1 bài lập trình':''}. Cần đạt <b>≥ 70%</b> để mở bài tiếp theo.</p>
        <button class="btn signal block mt16" data-act="step" data-s="quiz">Bắt đầu luyện tập</button>
        <button class="btn ghost block mt8" data-act="ask-lesson">Hỏi trợ lý AI về bài này</button>
      </div>
    </div>`;
  }

  if(w.step==='quiz'){
    const filled = w.ans.filter(x=>x!=null).length;
    return head + `
    <div class="page-head"><span class="eyebrow">${esc(L.title)}</span><h1>Luyện tập trắc nghiệm</h1></div>
    <div class="card pad" style="position:sticky;top:12px;z-index:20">
      <div class="between wrap">
        <div><span class="eyebrow">Đã trả lời</span><div class="mono" style="font-size:18px;font-weight:600">${filled} / ${L.quiz.length}</div></div>
        <div style="flex:1;max-width:300px"><div class="bar sig"><i style="width:${filled/L.quiz.length*100}%"></i></div></div>
        <button class="btn signal" data-act="${L.code?'step':'finish-lesson'}" data-s="code" ${filled<L.quiz.length?'disabled':''}>${L.code?'Sang phần thực hành →':'Nộp bài'}</button>
      </div>
    </div>
    <div class="mt20" style="max-width:820px">${qBlock(L.quiz, w.ans, false)}</div>`;
  }

  if(w.step==='code'){
    const ex = L.code;
    return head + `
    <div class="page-head"><span class="eyebrow">${esc(L.title)} · Thực hành</span><h1>${esc(ex.title)}</h1></div>
    <div class="side-layout">
      <div>
        ${editor(w.code, ex)}
        <div class="row mt12" style="gap:8px;flex-wrap:wrap">
          <button class="btn signal" data-act="grade-code" ${w.busy?'disabled':''}>${w.busy?'<span class="spin dk"></span> Đang chấm…':'Chấm bài'}</button>
          <button class="btn ghost" data-act="reset-code">Khôi phục khung gợi ý</button>
          ${w.grade?`<button class="btn" data-act="finish-lesson">Hoàn tất bài học →</button>`:''}
        </div>
        ${w.grade ? gradeCard(w.grade, ex) : ''}
      </div>
      <div class="stack gap16">
        <div class="card pad">
          <span class="eyebrow">Đề bài</span>
          <p class="mt8" style="font-size:14.5px">${ex.prompt}</p>
          <span class="eyebrow" style="display:block;margin-top:14px">Ví dụ</span>
          <pre class="code" style="font-size:12.5px">${esc(ex.io)}</pre>
        </div>
        <div class="card pad">
          <span class="eyebrow">Mẹo</span>
          <ul class="mt8" style="margin-left:18px;font-size:13.5px;color:var(--ink-2)">
            <li>Dùng phím Tab để thụt lề khối lệnh.</li>
            <li>Chấm bài được nhiều lần, điểm lấy lần cao nhất.</li>
            <li>Bí quá thì hỏi trợ lý AI ở góc màn hình.</li>
          </ul>
        </div>
      </div>
    </div>`;
  }

  /* step = result */
  const r = w.result;
  const rec = S.me.progress[L.id];
  const nextIdx = LESSONS.findIndex(x=>x.id===L.id) + 1;
  const nextL = LESSONS[nextIdx];
  return head + `
  <div class="page-head"><span class="eyebrow">${esc(L.title)}</span><h1>${r.total>=PASS?'Đạt yêu cầu':'Chưa đạt — hãy thử lại'}</h1></div>
  <div class="side-layout">
    <div>
      <div class="card pad">
        <div class="between wrap">
          <div>
            <span class="eyebrow">Điểm bài học</span>
            <div class="mono" style="font-size:44px;font-weight:600;letter-spacing:-.04em;color:${r.total>=PASS?'var(--teal)':'var(--rose)'}">${r.total}<span style="font-size:19px">/100</span></div>
            <p class="muted" style="font-size:13.5px">Trắc nghiệm ${r.qCorrect}/${L.quiz.length} câu${L.code?` · Code ${r.codeScore}/100`:''} · Lần làm thứ ${rec.att}</p>
          </div>
          <div style="min-width:200px;flex:1;max-width:320px">
            <div class="bar ${r.total>=PASS?'':'sig'}"><i style="width:${r.total}%;${r.total>=PASS?'':'background:var(--rose)'}"></i></div>
            <p class="mono" style="font-size:11px;color:var(--slate);margin-top:6px">Ngưỡng đạt: 70</p>
          </div>
        </div>
        ${r.total>=PASS
          ? `<div class="note teal mt16"><div class="t">Bài tiếp theo đã mở</div>${nextL?`Bạn có thể sang bài <b>${esc(nextL.title)}</b>.`:'Bạn đã hoàn thành bài cuối cùng của lộ trình. Bài kiểm tra tổng kết đang chờ bạn.'} Điểm cao nhất được ghi nhận là <b>${rec.best}%</b>.</div>`
          : `<div class="note mt16"><div class="t">Chưa mở được bài kế tiếp</div>Cần đạt tối thiểu 70 điểm. Hãy đọc kỹ phần phân tích lỗi bên dưới rồi làm lại — không giới hạn số lần.</div>`}
        <div class="note ${r.total>=PASS?'':'teal'} mt16"><div class="t">Trợ lý AI nhận xét</div>${w.coach?esc(w.coach):'<span class="row gap8"><span class="spin dk"></span> Đang tổng hợp nhận xét…</span>'}</div>
      </div>

      <h2 style="font-size:19px;margin:24px 0 12px">Chữa từng câu trắc nghiệm</h2>
      ${qBlock(L.quiz, w.ans, true, w.aiFb)}

      </div>
    </div>
  </div>`;

function renderBlock(b){
  if(b.h) return `<h2>${b.h}</h2>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.ul) return `<ul>${b.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.code) return `<pre class="code">${hl(b.code)}</pre>`;
  if(b.note) return `<div class="note"><div class="t">${b.tag||'Lưu ý'}</div>${b.note}</div>`;
  if(b.table) return `<table class="simple"><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return '';
}

   Chấm và ghi nhận kết quả bài học
   ============================================================ */
async function finishLesson(){
  const L = lessonById(S.work.id), w = S.work, u = S.me;
  const qCorrect = L.quiz.reduce((s,it,i)=> s + (w.ans[i]===it.ans?1:0), 0);
  const qScore = Math.round(qCorrect/L.quiz.length*100);
  const codeScore = w.grade ? w.grade.score : null;
  const total = L.code ? Math.round(qScore*0.6 + (codeScore||0)*0.4) : qScore;
  const wrongFocus = L.quiz.filter((it,i)=> w.ans[i]!==it.ans).map(it=>it.focus);

  const old = u.progress[L.id];
  u.progress[L.id] = {
    best: Math.max(total, old?old.best:0),
    att: (old?old.att:0) + 1,
    done: (old && old.done) || total >= PASS,
    at: today()
  };
  u.xp += xpFor(total, false);
  await saveDB();

  w.result = {total, qScore, qCorrect, codeScore, wrongFocus};
  w.step = 'result'; w.coach = null; w.aiFb = null;
  render();
  if(total>=PASS) toast(`Đạt ${total}/100 — bài tiếp theo đã mở`); else toast(`Đạt ${total}/100 — chưa đủ 70, hãy làm lại`);

  const c = await coachSummary({what:`bài học "${L.title}" môn Tin học 10`, score:total, wrong:wrongFocus});
  if(S.work===w){ w.coach = c; if(S.view==='lesson') render(); }
}

function retryLesson(){
  const L = lessonById(S.work.id);
  S.work = {kind:'lesson', id:L.id, step:'quiz', ans:Array(L.quiz.length).fill(null), code:L.code?L.code.starter:'', grade:null, coach:null, showSol:false};
  render();
}

async function finishFinal(){
  const w = S.work, u = S.me;
  const qCorrect = FINAL.quiz.reduce((s,it,i)=> s + (w.ans[i]===it.ans?1:0), 0);
  const qScore = Math.round(qCorrect/FINAL.quiz.length*100);
  const codeScore = w.grade ? w.grade.score : 0;
  const total = Math.round(qScore*0.7 + codeScore*0.3);
  const wrongFocus = FINAL.quiz.filter((it,i)=> w.ans[i]!==it.ans).map(it=>it.focus);
  u.final = {done:true, score:Math.max(total, u.final?u.final.score:0), at:today(), qCorrect, codeScore};
  u.xp += xpFor(total, true);
  await saveDB();
  w.result = {total, qCorrect, codeScore}; w.step='result'; w.coach=null;
  render();
  const c = await coachSummary({what:'bài kiểm tra tổng kết môn Tin học 10', score:total, wrong:wrongFocus});
  if(S.work===w){ w.coach=c; if(S.view==='final') render(); }
}

`Bạn đang hỗ trợ giáo viên môn Tin học 10. Dữ liệu học sinh:

Hãy viết 4-5 câu tiếng Việt đề xuất phương án hỗ trợ sư phạm cụ thể cho học sinh này: nên phụ đạo nội dung nào, giao nhiệm vụ dạng gì, xếp vào nhóm học tập nào. Không dùng markdown, không dùng tiêu đề.`}], TUTOR_SYS, 500);

async function chatSend(text){
  const q = (text!=null ? text : ($('#chat-in') ? $('#chat-in').value : '')).trim();
  if(!q || S.chatBusy) return;
  S.chatLog.push({role:'user', content:q});
  S.chatBusy = true; render();
  const ctx = S.me.role==='teacher'
    ? `Người hỏi là giáo viên môn Tin học 10, đang phụ trách lớp 10A3 gồm ${students().length} học sinh trải trên 4 cấp độ.`
    : `Người hỏi là học sinh lớp 10, được xếp cấp độ ${S.me.level?levelOf(S.me.level).name:'chưa xác định'}, đã đạt ${doneCount(S.me)}/${LESSONS.length} bài${S.view==='lesson'&&S.work?`, đang học bài "${lessonById(S.work.id).title}"`:''}.`;
  let ans;
  try{
    ans = await askAI(
      S.chatLog.slice(-10).map(m=>({role:m.role==='user'?'user':'assistant', content:m.content})),
      TUTOR_SYS + '\nBối cảnh: ' + ctx, 900);
    AI_OK = true;
  }catch(e){
    AI_OK = false;
    ans = chatFallback(q);
  }
  S.chatLog.push({role:'assistant', content:ans});
  S.chatBusy = false; render();
  const log = $('#chat-log'); if(log) log.scrollTop = log.scrollHeight;
}

function chatFallback(q){
  const s = q.toLowerCase();
  if(/\/\/|chia|phần dư|phan du|%/.test(s))
    return 'Trong Python có ba phép chia:\n• / cho kết quả số thực, ví dụ 7 / 2 = 3.5\n• // lấy phần nguyên, ví dụ 7 // 2 = 3\n• % lấy phần dư, ví dụ 7 % 2 = 1\nMẹo: muốn kiểm tra n chẵn hay lẻ thì dùng n % 2 == 0.';
  if(/vòng lặp|vong lap|for|while/.test(s))
    return 'Chọn vòng lặp theo câu hỏi: có biết trước số lần lặp không?\n• Biết trước → dùng for với range. Nhớ range(a, b) lấy từ a và dừng trước b.\n• Chưa biết, chỉ biết điều kiện dừng → dùng while, và nhớ cập nhật biến điều kiện trong thân vòng lặp, nếu không sẽ lặp vô hạn.';
  if(/if|rẽ nhánh|re nhanh|điều kiện|dieu kien/.test(s))
    return 'Cấu trúc rẽ nhánh dùng if / elif / else. Ba điểm cần nhớ:\n• Kết thúc dòng điều kiện bằng dấu hai chấm.\n• Thụt lề khối lệnh bên dưới, thường là 4 dấu cách.\n• Các điều kiện được xét lần lượt từ trên xuống và dừng ở nhánh đúng đầu tiên, nên hãy đặt ngưỡng chặt nhất lên trước.';
  if(/nhị phân|nhi phan|binary|hệ 2|he 2/.test(s))
    return 'Đổi nhị phân sang thập phân: viết trọng số 8 4 2 1 dưới từng bit rồi cộng các vị trí có bit 1. Ví dụ 1011 = 8 + 2 + 1 = 11.\nĐổi thập phân sang nhị phân: chia liên tiếp cho 2, ghi số dư, rồi đọc các số dư từ dưới lên.';
  if(/xâu|xau|chuỗi|chuoi|string/.test(s))
    return 'Xâu là dãy ký tự, đánh chỉ số từ 0. Cắt xâu s[a:b] lấy từ a và dừng trước b. Xâu là bất biến nên không gán được s[0] = "X", muốn đổi phải tạo xâu mới. Các phương thức hay dùng: upper, lower, strip, split, replace, count.';
  if(/hàm|ham|def|return/.test(s))
    return 'Hàm được định nghĩa bằng def, ví dụ def tinh(a, b):. Hai điều hay nhầm:\n• return trả giá trị về cho chương trình, print chỉ hiển thị ra màn hình.\n• Biến khai báo trong hàm là biến cục bộ, bên ngoài hàm không dùng được.';
  if(/học gì|hoc gi|tiếp theo|tiep theo|lộ trình|lo trinh/.test(s)){
    const i = LESSONS.findIndex((l,k)=>lessonState(S.me,k)==='open'||lessonState(S.me,k)==='review');
    return i>=0 ? `Bài tiếp theo của bạn là "${LESSONS[i].title}" (cấp ${LESSONS[i].lv}). Mục tiêu: ${LESSONS[i].goal}` : 'Bạn đã hoàn thành lộ trình. Hãy làm bài kiểm tra tổng kết môn học.';
  }
  return 'Hiện chưa kết nối được tới mô hình AI nên mình đang trả lời bằng kho kiến thức có sẵn. Bạn thử hỏi cụ thể hơn về một chủ đề trong Tin học 10 nhé: hệ nhị phân, mạng máy tính, an toàn thông tin, biến và kiểu dữ liệu, rẽ nhánh, vòng lặp, danh sách, xâu, hàm hoặc thuật toán tìm kiếm.';
}

function afterRender(){
  const ta = $('#code-in');
  if(ta){
    const sync = ()=>{
      const n = Math.max(ta.value.split('\n').length, 12);
      const g = $('#gutter'); if(g) g.innerHTML = Array.from({length:n},(_,i)=>i+1).join('<br>');
      if(S.work) S.work.code = ta.value;
    };
    ta.addEventListener('input', sync);
    ta.addEventListener('scroll', ()=>{ const g=$('#gutter'); if(g) g.scrollTop = ta.scrollTop; });
    ta.addEventListener('keydown', e=>{
      if(e.key==='Tab'){ e.preventDefault();
        const s=ta.selectionStart, t=ta.selectionEnd;
        ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(t);
        ta.selectionStart = ta.selectionEnd = s+4; sync();
      }
    });
  }
  const ci = $('#chat-in');
  if(ci){ if(document.activeElement===document.body) ci.focus(); ci.addEventListener('keydown', e=>{ if(e.key==='Enter') chatSend(); }); }
  const log = $('#chat-log'); if(log) log.scrollTop = log.scrollHeight;
  const pw = $('#lg-pw');
  if(pw) pw.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  const lq = $('#lib-q');
  if(lq) lq.addEventListener('keydown', e=>{ if(e.key==='Enter'){ S.libFilter.q = lq.value.trim(); render(); } });
}

document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;

  if(a==='tab'){ S.authTab = el.dataset.t; render(); }
  else if(a==='fill'){ $('#lg-id').value = el.dataset.id; $('#lg-pw').value = '123456'; $('#lg-err').classList.add('hide'); }
  else if(a==='login'){ doLogin(); }
  else if(a==='logout'){ S.me=null; S.work=null; S.chatOpen=false; S.chatLog=[]; S.view='auth'; render(); }
  else if(a==='go'){ S.work = (el.dataset.v==='final'&&S.work&&S.work.kind==='final')?S.work:null; go(el.dataset.v); }
  else if(a==='locked'){ toast('Bài này chưa mở — hãy đạt từ 70% ở bài liền trước.'); }
  else if(a==='open-lesson'){ S.work=null; go('lesson',{id:el.dataset.id}); }
  else if(a==='open-student'){ go('t-student',{id:el.dataset.id}); }
  else if(a==='open-resource'){
    const L = lessonById(el.dataset.id), idx = LESSONS.findIndex(x=>x.id===L.id);
    if(!isUnlocked(S.me, idx)){ toast('Học liệu này thuộc bài chưa mở — hãy đạt từ 70% ở bài liền trước.'); }
    else{
      S.work = {kind:'lesson', id:L.id, step:el.dataset.step, ans:Array(L.quiz.length).fill(null), code:L.code?L.code.starter:'', grade:null, coach:null, showSol:false};
      go('lesson', {id:L.id});
    }
  }
  else if(a==='lib-search'){ const v=$('#lib-q'); S.libFilter.q = v?v.value.trim():''; render(); }
  else if(a==='lib-type'){ S.libFilter.type = el.dataset.t; render(); }
  else if(a==='lib-lv'){ S.libFilter.lv = el.dataset.l; render(); }
  else if(a==='save-teacher-set'){
    const uu = S.db.users[el.dataset.id];
    uu.level = +$('#lvl-sel').value;
    uu.group = $('#grp-sel').value || null;
    await saveDB(); toast('Đã lưu cấp độ và nhóm.'); render();
  }
  else if(a==='save-note'){
    const uu = S.db.users[el.dataset.id];
    uu.note = $('#note-in').value.trim() || null;
    await saveDB(); toast('Đã giao nhiệm vụ cho học sinh.'); render();
  }
  else if(a==='unlock-lesson'){
    const uu = S.db.users[el.dataset.id];
    uu.unlock = uu.unlock || [];
    if(!uu.unlock.includes(el.dataset.lid)) uu.unlock.push(el.dataset.lid);
    await saveDB(); toast('Đã mở khóa bài học cho học sinh.'); render();
  }
  else if(a==='advise'){ adviseStudent(el.dataset.id); }
  else if(a==='pick'){
    const i=+el.dataset.i, j=+el.dataset.j, y=window.scrollY;
    S.work.ans[i] = (S.work.ans[i]===j) ? null : j;
    render(); window.scrollTo(0, y);
  }
  else if(a==='submit-placement'){ el.disabled=true; el.innerHTML='<span class="spin"></span> Đang xếp lộ trình…'; submitPlacement(); }
  else if(a==='step'){ S.work.step = el.dataset.s; render(); }
  else if(a==='reset-code'){
    const ex = S.work.kind==='final' ? FINAL.code : lessonById(S.work.id).code;
    S.work.code = ex.starter; S.work.grade=null; render();
  }
  else if(a==='toggle-sol'){ S.work.showSol = !S.work.showSol; render(); }
  else if(a==='grade-code'){
    const ex = S.work.kind==='final' ? FINAL.code : lessonById(S.work.id).code;
    const ta2 = $('#code-in'); if(ta2) S.work.code = ta2.value;
    S.work.busy = true; render();
    const g = await gradeCode(ex, S.work.code);
    S.work.busy = false; S.work.grade = g; render();
    toast(g.score>=PASS ? `Code đạt ${g.score}/100` : `Code đạt ${g.score}/100 — xem phần lỗi bên dưới`);
  }
  else if(a==='finish-lesson'){ finishLesson(); }
  else if(a==='retry-lesson'){ retryLesson(); }
  else if(a==='finish-final'){ finishFinal(); }
  else if(a==='retry-final'){ S.work=null; go('final'); }
  else if(a==='ask-lesson'){
    S.chatOpen = true; render();
    chatSend('Em đang học bài "'+lessonById(S.work.id).title+'". Thầy/cô tóm tắt giúp em những ý quan trọng nhất cần nhớ của bài này với ạ.');
  }
  else if(a==='chat-open'){ S.chatOpen=true; render(); }
  else if(a==='chat-close'){ S.chatOpen=false; render(); }
  else if(a==='chat-send'){ chatSend(); }
  else if(a==='chat-sug'){ chatSend(el.dataset.q); }
});

/* ============================================================
   Khởi động
   ============================================================ */
(async function init(){
  await loadDB();
  await saveDB();
  render();
})();
</script>
</body>
</html>
